
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>EDFWB2 Checklist</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      background: #181818;
      color: white;
    }
    label {
      display: block;
      margin: 15px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>EDFWB2 Checklist</h1>
  <p>方塊地球防衛軍 2 收集進度測試</p>

  <label>
    <input type="checkbox" id="item1">
    收集第一個角色
  </label>

  <label>
    <input type="checkbox" id="item2">
    收集第一把武器
  </label>

  <script>
    for (const id of ["item1", "item2"]) {
      const checkbox = document.getElementById(id);

      checkbox.checked =
        localStorage.getItem(id) === "true";

      checkbox.addEventListener("change", () => {
        localStorage.setItem(id, checkbox.checked);
      });
    }
  </script>
</body>
</html>
